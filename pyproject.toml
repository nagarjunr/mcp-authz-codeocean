[project]
name = "mcp-local-authz"
version = "0.1.0"
description = "Local, control-plane-optional authorization policy engine for MCP servers in disconnected industrial deployments"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Nagarjun Rajendran" }]
dependencies = [
    "pyyaml>=6.0",
    "cryptography>=43.0",
    "fastmcp>=3.4.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "paho-mqtt>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
